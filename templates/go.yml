# Go servisleri için lint, test ve build job'ları.
# Kullanan repo: include listesinde base.yml'den sonra gelir.
# Sürümler değişken; bir repo gerekirse kendi .gitlab-ci.yml'sinde değiştirebilir.
variables:
  GO_VERSION: "1.27"
  # golangci-lint, projenin Go sürümüyle (ya da daha yenisiyle) derlenmiş olmalı (F0-09'da yaşandı).
  GOLANGCI_LINT_VERSION: "v2.15.0"

go-lint:
  stage: lint
  image: golangci/golangci-lint:${GOLANGCI_LINT_VERSION}
  script:
    - golangci-lint --version
    - golangci-lint run ./...

go-test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go version
    # -race: eşzamanlılık hatalarını yakalar (lokalde kapalı, CI'da açık).
    - go test -race -count=1 ./...

go-build:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - go build ./...
