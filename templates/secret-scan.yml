# gitleaks: repoya token, şifre ya da anahtar girmiş mi?
# Bütün git geçmişini tarar; bir şey bulursa job kırmızı olur ve MR merge edilemez.
secret-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    # Varsayılan sığ klon yerine bütün geçmişi çek.
    GIT_DEPTH: "0"
  script:
    # Runner'ın klonladığı klasörün sahibi farklı kullanıcı; git'e güvenli olduğunu söyle.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --verbose "$CI_PROJECT_DIR"
